<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Sama Khol ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #333;
            position: relative;
        }

        /* Vidéo en arrière-plan */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Voile léger pour assombrir un peu la vidéo et rendre le texte plus lisible */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .photo-wrapper {
            width: 100%;
            height: 250px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background-color: #ffe6ea;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            margin-bottom: 15px;
            font-size: 2.3rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
            min-height: 60px;
        }

        button {
            background: linear-gradient(45deg, #ff4081, #d81b60);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 18px rgba(216, 27, 96, 0.4);
            outline: none;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(216, 27, 96, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .floating-element {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            opacity: 0;
            z-index: 2;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Vidéo d'arrière-plan -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="fond.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="card" id="card">
            <div class="photo-wrapper" id="photo-box">
                <img id="image" src="image0.jpeg" alt="Sama Khol">
            </div>
            <h1 id="title">Un petit mot pour toi...</h1>
            <p id="text">Prends une grande inspiration et clique ci-dessous pour commencer ce petit voyage.</p>
            <button id="next-btn" onclick="nextStep()">Découvrir ✨</button>
        </div>
    </div>

    <script>
        const steps = [
            {
                title: "Pour Sama Khol ❤️",
                text: "J'ai voulu te préparer une petite surprise, juste pour illuminer ta journée et te faire sourire.",
                image: "image1.jpeg"
            },
            {
                title: "Nos précieux moments...",
                text: "Chaque instant passé à tes côtés est gravé dans mon cœur comme un souvenir inestimable.",
                image: "image2.jpeg"
            },
            {
                title: "Une évidence au quotidien...",
                text: "Tu apportes une douceur, une joie et une lumière uniques dans ma vie.",
                image: "image3.jpeg"
            },
            {
                title: "Toujours à tes côtés...",
                text: "Regarde le chemin parcouru et tout ce qu'il nous reste encore à construire ensemble.",
                image: "image4.jpeg"
            },
            {
                title: "Je t'aime Sama Khol ❤️",
                text: "Simplement, profondément et sincèrement. Tu es tout pour moi.",
                image: "image5.jpeg",
                isFinal: true
            }
        ];

        let currentStep = 0;

        function nextStep() {
            if (currentStep < steps.length) {
                const step = steps[currentStep];
                const card = document.getElementById('card');
                
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';

                setTimeout(() => {
                    document.getElementById('title').innerText = step.title;
                    document.getElementById('text').innerText = step.text;
                    document.getElementById('image').src = step.image;

                    card.style.opacity = '1';
                    card.style.transform = 'scale(1)';

                    if (step.isFinal) {
                        document.getElementById('next-btn').style.display = 'none';
                        startFloatingEffects();
                    } else {
                        document.getElementById('next-btn').innerText = "Continuer ✨";
                    }
                }, 300);

                currentStep++;
            }
        }

        function createFloatingElement() {
            const icons = ['❤️', '💖', '✨', '💕', '🌸'];
            const el = document.createElement('div');
            el.classList.add('floating-element');
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '100vh';
            el.style.fontSize = (Math.random() * 15 + 20) + 'px';
            el.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 4000);
        }

        function startFloatingEffects() {
            setInterval(createFloatingElement, 250);
        }
    </script>
</body>
</html>
