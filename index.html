
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#210d1c">

<title>Pour Sama Khol ❤️</title>

<link
  href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
  rel="stylesheet"
>

<style>
:root {
  --rose: #ffd1e1;
  --rose-fort: #ff5c98;
  --blanc: #fff8fb;
  --hauteur: 100dvh;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: #210d1c;
  color: var(--blanc);
  font-family: "Poppins", sans-serif;
}

/* ==================================
   VIDEO EN ARRIERE-PLAN
================================== */

.bg-video {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;
  height: 100dvh;

  object-fit: cover;

  z-index: 0;
  pointer-events: none;
}

.bg-overlay {
  position: fixed;
  inset: 0;

  background: rgba(20, 4, 15, 0.18);

  z-index: 1;
  pointer-events: none;
}

/* ==================================
   APPLICATION
================================== */

.app {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100vh;
  height: var(--hauteur);

  overflow: hidden;
}

/* ==================================
   PAGE D'ACCUEIL
================================== */

.welcome {
  position: absolute;
  inset: 0;
  z-index: 5;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  padding: 16px 16px 5dvh;

  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}

.welcome-card {
  width: min(100%, 570px);
  max-height: 86dvh;

  overflow-y: auto;

  padding: 24px 20px;

  text-align: center;

  border-radius: 24px;

  background: rgba(38, 12, 31, 0.55);
  border: 1px solid rgba(255, 210, 229, 0.38);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
}

.welcome-label {
  font-size: 11px;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--rose);
}

.welcome h1 {
  margin: 12px 0;

  font-family: "Dancing Script", cursive;
  font-size: clamp(2.5rem, 9vw, 4.5rem);

  color: var(--rose);
}

.welcome p {
  max-width: 470px;
  margin: 12px auto 22px;

  font-size: clamp(0.92rem, 2.5vw, 1.1rem);
  line-height: 1.65;
}

/* PHOTO D'ACCUEIL */

.welcome-photo {
  width: min(100%, 230px);
  height: clamp(110px, 19dvh, 190px);

  margin: 0 auto 15px;

  border-radius: 16px;
  overflow: hidden;
}

.welcome-photo img {
  width: 100%;
  height: 100%;
  display: block;

  object-fit: cover;
  object-position: center;
}

/* BOUTONS */

button {
  border: 1px solid rgba(255, 221, 234, 0.75);
  border-radius: 35px;

  background: linear-gradient(
    135deg,
    #ff79a8,
    #e63d7d
  );

  color: white;

  padding: 11px 18px;

  font-family: "Poppins", sans-serif;
  font-size: 13px;
  font-weight: 600;

  cursor: pointer;
  touch-action: manipulation;

  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.15);

  transition:
    transform 0.25s,
    background 0.25s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.97);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.app.opened .welcome {
  opacity: 0;
  transform: translateY(-25px);
  pointer-events: none;
}

/* ==================================
   LES DEUX ZONES
================================== */

.story-layout {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 3dvh;

  width: 100%;
  height: 45dvh;

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    minmax(0, 1fr);

  gap: clamp(8px, 2vw, 20px);

  padding: 0 clamp(10px, 3vw, 45px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.8s ease,
    visibility 0.8s;
}

.app.opened .story-layout {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transition-delay: 0.25s;
}

/* ==================================
   ZONE TEXTE A GAUCHE
================================== */

.message-panel {
  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 18px;

  background: rgba(35, 11, 29, 0.78);
  border: 1px solid rgba(255, 210, 229, 0.35);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.20);

  opacity: 0;
  transform: translateX(-35px);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}

.app.opened .message-panel {
  opacity: 1;
  transform: translateX(0);
}

.message-heading {
  flex-shrink: 0;

  padding: 15px 10px 10px;

  text-align: center;

  border-bottom: 1px solid rgba(255, 210, 229, 0.20);
}

.message-heading h2 {
  margin: 0;

  font-family: "Dancing Script", cursive;
  font-size: clamp(1.4rem, 3vw, 2.1rem);
  line-height: 1.15;

  color: var(--rose);
}

.step-count {
  display: block;

  margin-top: 6px;

  font-size: 10px;
  color: #f5cddd;
}

/* TEXTE DEFILANT */

.message-scroll {
  flex: 1;
  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;

  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;

  padding: 12px 18px;

  scrollbar-width: thin;
  scrollbar-color: #e99bbb transparent;
}

.message-scroll p {
  margin: 10px 0;

  font-size: clamp(0.95rem, 1.6vw, 1.15rem);
  line-height: 1.75;

  text-align: center;
  overflow-wrap: break-word;
}

/* BOUTON CONTINUER */

.message-actions {
  flex-shrink: 0;

  padding: 10px;

  display: flex;
  justify-content: center;

  border-top: 1px solid rgba(255, 210, 229, 0.15);
}

.message-actions button {
  max-width: 100%;
}

/* ==================================
   ZONE PHOTO A DROITE
================================== */

.photo-panel {
  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;

  opacity: 0;
  transform: translateX(-35px);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}

.app.opened .photo-panel {
  opacity: 1;
  transform: translateX(0);
}

/* PAS DE FOND SUR LA PHOTO */

.photo-frame {
  width: 100%;
  flex: 1;
  min-height: 0;

  overflow: hidden;

  border-radius: 14px;

  background: transparent;
  border: none;
  box-shadow: none;
}

.photo-frame img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  transition:
    opacity 0.35s ease,
    transform 0.5s ease;
}

.photo-frame img.fade {
  opacity: 0;
  transform: scale(0.97);
}

/* PETIT TEXTE SOUS LA PHOTO */

.photo-caption {
  height: 38px;
  flex-shrink: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  font-size: 11px;
  color: #ffe1ec;

  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
}

/* ==================================
   COEURS FLOTTANTS
================================== */

.floating-element {
  position: fixed;
  bottom: -40px;

  z-index: 4;
  pointer-events: none;

  animation: floatUp linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.8) rotate(0deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateY(-110dvh) scale(1.2) rotate(30deg);
    opacity: 0;
  }
}

/* ==================================
   VERSION TELEPHONE
================================== */

@media (max-width: 650px) {

  .welcome {
    padding: 10px 12px 5dvh;
  }

  .welcome-card {
    padding: 18px 14px;
  }

  .welcome h1 {
    font-size: clamp(2.3rem, 10vw, 3.5rem);
  }

  .welcome p {
    font-size: 0.9rem;
  }

  .story-layout {
    height: 45dvh;
    bottom: 3dvh;

    gap: 8px;
    padding: 0 9px;
  }

  .message-panel {
    border-radius: 12px;
    background: rgba(35, 11, 29, 0.84);
  }

  .message-heading {
    padding: 11px 5px 8px;
  }

  .message-heading h2 {
    font-size: clamp(1.1rem, 5vw, 1.55rem);
  }

  .step-count {
    margin-top: 4px;
    font-size: 9px;
  }

  .message-scroll {
    padding: 8px 8px;
  }

  .message-scroll p {
    font-size: clamp(0.79rem, 3.3vw, 0.98rem);
    line-height: 1.6;
  }

  .message-actions {
    padding: 7px 4px;
  }

  .message-actions button {
    padding: 9px 10px;
    font-size: 11px;
  }

  .photo-frame {
    border-radius: 12px;
  }

  .photo-caption {
    height: 32px;
    font-size: 10px;
  }
}

/* PETITS TELEPHONES */

@media (max-width: 360px) {

  .story-layout {
    gap: 6px;
    padding: 0 6px;
  }

  .message-heading h2 {
    font-size: 1.1rem;
  }

  .message-scroll {
    padding: 6px;
  }

  .message-scroll p {
    font-size: 0.78rem;
    line-height: 1.5;
  }

  .message-actions button {
    padding: 8px 7px;
    font-size: 10px;
  }
}

/* MODE PAYSAGE */

@media (max-height: 450px) and (orientation: landscape) {

  .story-layout {
    height: 45dvh;
    bottom: 2dvh;
  }

  .message-heading {
    padding: 5px;
  }

  .message-heading h2 {
    font-size: 1.05rem;
  }

  .step-count {
    display: none;
  }

  .message-scroll {
    padding: 4px 8px;
  }

  .message-scroll p {
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .message-actions {
    padding: 4px;
  }

  .message-actions button {
    padding: 5px 9px;
  }

  .photo-caption {
    height: 24px;
  }

  .welcome-photo {
    height: 75px;
  }

  .welcome-card {
    padding: 10px;
  }

  .welcome h1 {
    margin: 5px 0;
    font-size: 2rem;
  }

  .welcome p {
    margin: 6px auto;
    font-size: 0.8rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<!-- VIDEO EN FOND -->

<video
  class="bg-video"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  aria-hidden="true">

  <source src="./fond.mp4" type="video/mp4">

</video>

<div class="bg-overlay"></div>

<main class="app" id="app">

  <!-- ACCUEIL -->

  <section class="welcome" id="welcome">

    <div class="welcome-card">

      <div class="welcome-photo">
        <img
          src="./image0.jpeg"
          alt="Un souvenir pour Sama Khol">
      </div>

      <div class="welcome-label">
        Une surprise rien que pour toi
      </div>

      <h1>Pour Sama Khol ❤️</h1>

      <p>
        Prends une grande inspiration et clique
        ci-dessous pour commencer ce petit voyage.
      </p>

      <button id="open-btn" type="button">
        Découvrir ✨
      </button>

    </div>

  </section>

  <!-- HISTOIRE -->

  <section class="story-layout" id="story">

    <!-- MESSAGE A GAUCHE -->

    <article class="message-panel">

      <header class="message-heading">

        <h2 id="story-title">
          Pour Sama Khol ❤️
        </h2>

        <span class="step-count" id="step-count">
          1 / 5
        </span>

      </header>

      <div
        class="message-scroll"
        id="message-scroll"
        tabindex="0">

        <p id="story-text"></p>

      </div>

      <div class="message-actions">

        <button id="next-btn" type="button">
          Continuer ✨
        </button>

      </div>

    </article>

    <!-- PHOTO A DROITE -->

    <aside class="photo-panel">

      <div class="photo-frame">

        <img
          id="story-image"
          src="./image1.jpeg"
          alt="Notre souvenir">

      </div>

      <div class="photo-caption" id="photo-caption">
        Un souvenir, une émotion ❤️
      </div>

    </aside>

  </section>

</main>

<script>
"use strict";

/* ==================================
   LES CINQ ETAPES DE TON MESSAGE
================================== */

const steps = [
  {
    title: "Pour Sama Khol ❤️",
    text: "J'ai voulu te préparer une petite surprise, juste pour illuminer ta journée et te faire sourire.",
    image: "./image1.jpeg"
  },
  {
    title: "Nos précieux moments...",
    text: "Chaque instant passé à tes côtés est gravé dans mon cœur comme un souvenir inestimable.",
    image: "./image2.jpeg"
  },
  {
    title: "Une évidence au quotidien...",
    text: "Tu apportes une douceur, une joie et une lumière uniques dans ma vie.",
    image: "./image3.jpeg"
  },
  {
    title: "Toujours à tes côtés...",
    text: "Regarde le chemin parcouru et tout ce qu'il nous reste encore à construire ensemble.",
    image: "./image4.jpeg"
  },
  {
    title: "Je t'aime Sama Khol ❤️",
    text: "Simplement, profondément et sincèrement. Tu es tout pour moi.",
    image: "./image5.jpeg",
    isFinal: true
  }
];

/* ELEMENTS */

const app = document.getElementById("app");

const welcome = document.getElementById("welcome");

const story = document.getElementById("story");

const openBtn = document.getElementById("open-btn");

const nextBtn = document.getElementById("next-btn");

const titleEl = document.getElementById("story-title");

const textEl = document.getElementById("story-text");

const imageEl = document.getElementById("story-image");

const countEl = document.getElementById("step-count");

const scrollEl = document.getElementById("message-scroll");

const captionEl = document.getElementById("photo-caption");

const video = document.querySelector(".bg-video");

let currentStep = 0;

let changing = false;

let heartsTimer = null;

let opened = false;

story.inert = true;

/* ==================================
   AFFICHER UNE ETAPE
================================== */

function showStep(index, animate = true) {

  if (changing || index >= steps.length) {
    return;
  }

  changing = true;

  const step = steps[index];

  if (animate) {
    imageEl.classList.add("fade");
    textEl.style.opacity = "0";
  }

  setTimeout(() => {

    titleEl.textContent = step.title;

    textEl.textContent = step.text;

    imageEl.src = step.image;

    imageEl.alt = `Souvenir ${index + 1}`;

    countEl.textContent =
      `${index + 1} / ${steps.length}`;

    scrollEl.scrollTop = 0;

    captionEl.textContent =
      step.isFinal
        ? "Toi, moi, et tout ce qu'il nous reste à vivre ❤️"
        : "Un souvenir, une émotion ❤️";

    imageEl.classList.remove("fade");

    textEl.style.opacity = "1";

    currentStep = index;

    if (step.isFinal) {

      nextBtn.style.display = "none";

      startFloatingEffects();

    } else {

      nextBtn.style.display = "inline-block";

      nextBtn.textContent = "Continuer ✨";

    }

    changing = false;

  }, animate ? 320 : 0);
}

/* ==================================
   OUVRIR LA SURPRISE
================================== */

openBtn.addEventListener("click", () => {

  if (opened) return;

  opened = true;

  app.classList.add("opened");

  story.inert = false;

  welcome.inert = true;

  showStep(0, false);

});

/* ==================================
   ETAPE SUIVANTE
================================== */

nextBtn.addEventListener("click", () => {

  if (changing) return;

  const nextIndex = currentStep + 1;

  if (nextIndex < steps.length) {

    showStep(nextIndex);

  }

});

/* ==================================
   EFFETS DE COEURS
================================== */

function createFloatingElement() {

  const icons = [
    "❤️",
    "💖",
    "✨",
    "💕",
    "🌸"
  ];

  const element = document.createElement("div");

  element.className = "floating-element";

  element.textContent =
    icons[Math.floor(Math.random() * icons.length)];

  element.style.left =
    Math.random() * 100 + "vw";

  element.style.fontSize =
    (Math.random() * 14 + 18) + "px";

  const duration =
    Math.random() * 2 + 4;

  element.style.animationDuration =
    duration + "s";

  document.body.appendChild(element);

  setTimeout(() => {

    element.remove();

  }, (duration + 0.2) * 1000);
}

function startFloatingEffects() {

  if (heartsTimer !== null) return;

  const reducedMotion =
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

  if (reducedMotion) return;

  heartsTimer = setInterval(() => {

    createFloatingElement();

  }, 500);
}

/* ==================================
   VIDEO
================================== */

video.play().catch(() => {});

/* ==================================
   BLOQUER LE DEFILEMENT GLOBAL
================================== */

document.addEventListener("wheel", (event) => {

  if (!event.target.closest(".message-scroll")) {

    event.preventDefault();

  }

}, { passive: false });

document.addEventListener("touchmove", (event) => {

  if (!event.target.closest(".message-scroll")) {

    event.preventDefault();

  }

}, { passive: false });

</script>

</body>
</html>
