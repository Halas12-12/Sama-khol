
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#210d1c">

<title>Pour Sama Khol ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --rose: #ffd1e1;
  --rose-fort: #ff5c98;
  --blanc: #fff8fb;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: #210d1c;
  color: var(--blanc);
  font-family: "Poppins", sans-serif;
}

/* VIDEO EN ARRIERE-PLAN */

.bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 4, 15, 0.15);
  z-index: 1;
  pointer-events: none;
}

.app {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ACCUEIL */

.welcome {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px 14px 5dvh;
  transition: opacity .8s ease, transform .8s ease;
}

.welcome-card {
  width: min(100%, 510px);
  max-height: 75dvh;
  overflow-y: auto;
  padding: 18px 18px 20px;
  border-radius: 22px;
  text-align: center;
  background: rgba(38, 12, 31, .48);
  border: 1px solid rgba(255, 210, 229, .35);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
}

.welcome-photo {
  width: min(100%, 185px);
  height: clamp(90px, 14dvh, 135px);
  margin: 0 auto 12px;
  border-radius: 14px;
  overflow: hidden;
}

.welcome-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.welcome-label {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--rose);
}

.welcome h1 {
  margin: 8px 0;
  font-family: "Dancing Script", cursive;
  font-size: clamp(2rem, 7vw, 3.6rem);
  line-height: 1.15;
  color: var(--rose);
}

.welcome p {
  margin: 10px auto 16px;
  max-width: 450px;
  font-size: clamp(.85rem, 2.2vw, 1rem);
  line-height: 1.5;
}

button {
  border: 1px solid rgba(255, 221, 234, .75);
  border-radius: 35px;
  background: linear-gradient(135deg, #ff79a8, #e63d7d);
  color: white;
  padding: 10px 17px;
  font-family: "Poppins", sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 5px 16px rgba(0, 0, 0, .15);
  transition: transform .25s;
}

button:hover {
  transform: translateY(-2px);
}

button:active {
  transform: scale(.97);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.app.opened .welcome {
  opacity: 0;
  transform: translateY(-25px);
  pointer-events: none;
}

/* DEUX ZONES IDENTIQUES */

.story-layout {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 5dvh;

  width: 100%;
  height: min(37dvh, 340px);

  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(10px, 2vw, 22px);
  padding: 0 clamp(16px, 5vw, 70px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .8s ease, visibility .8s;
}

.app.opened .story-layout {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition-delay: .25s;
}

/* MESSAGE A GAUCHE */

.message-panel {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
  overflow: hidden;

  border-radius: 16px;
  background: rgba(35, 11, 29, .76);
  border: 1px solid rgba(255, 210, 229, .35);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, .16);

  opacity: 0;
  transform: translateX(-30px);
  transition: opacity .9s ease, transform .9s ease;
}

.app.opened .message-panel {
  opacity: 1;
  transform: translateX(0);
}

.message-heading {
  flex-shrink: 0;
  padding: 12px 7px 8px;
  text-align: center;
  border-bottom: 1px solid rgba(255, 210, 229, .18);
}

.message-heading h2 {
  margin: 0;
  font-family: "Dancing Script", cursive;
  font-size: clamp(1.25rem, 2.6vw, 1.9rem);
  line-height: 1.2;
  color: var(--rose);
}

.step-count {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  color: #f5cddd;
}

.message-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
  scrollbar-width: thin;
  scrollbar-color: #e99bbb transparent;
}

.message-scroll p {
  margin: 0;
  text-align: center;
  font-size: clamp(.88rem, 1.5vw, 1.08rem);
  line-height: 1.65;
  overflow-wrap: break-word;
}

.message-actions {
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  padding: 8px;
  border-top: 1px solid rgba(255, 210, 229, .15);
}

.message-actions button {
  max-width: 100%;
}

/* PHOTO A DROITE */

.photo-panel {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;

  opacity: 0;
  transform: translateX(-30px);
  transition: opacity .9s ease, transform .9s ease;
}

.app.opened .photo-panel {
  opacity: 1;
  transform: translateX(0);
}

.photo-frame {
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 13px;
  background: transparent;
  border: none;
  box-shadow: none;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  transition: opacity .35s ease, transform .5s ease;
}

.photo-frame img.fade {
  opacity: 0;
  transform: scale(.97);
}

.photo-caption {
  height: 30px;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 10px;
  color: #ffe1ec;
  text-shadow: 0 2px 6px rgba(0, 0, 0, .9);
}

/* COEURS FLOTTANTS */

.floating-element {
  position: fixed;
  bottom: -40px;
  z-index: 4;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(.8) rotate(0);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translateY(-110dvh) scale(1.2) rotate(30deg);
    opacity: 0;
  }
}

/* TELEPHONES */

@media (max-width: 650px) {
  .welcome {
    padding: 10px 12px 5dvh;
  }

  .welcome-card {
    padding: 16px 13px 18px;
    max-height: 70dvh;
  }

  .welcome-photo {
    width: min(100%, 175px);
    height: 115px;
  }

  .welcome h1 {
    font-size: clamp(2rem, 8vw, 3rem);
  }

  .welcome p {
    font-size: .85rem;
  }

  .story-layout {
    height: 36dvh;
    bottom: 6dvh;
    gap: 10px;
    padding: 0 15px;
  }

  .message-panel {
    border-radius: 12px;
    background: rgba(35, 11, 29, .82);
  }

  .message-heading {
    padding: 9px 4px 6px;
  }

  .message-heading h2 {
    font-size: clamp(1.05rem, 4.5vw, 1.45rem);
  }

  .step-count {
    font-size: 9px;
  }

  .message-scroll {
    padding: 10px 8px;
  }

  .message-scroll p {
    font-size: clamp(.77rem, 3.2vw, .95rem);
    line-height: 1.55;
  }

  .message-actions {
    padding: 7px 4px;
  }

  .message-actions button {
    padding: 8px 10px;
    font-size: 11px;
  }

  .photo-frame {
    border-radius: 11px;
  }

  .photo-caption {
    height: 25px;
    font-size: 9px;
  }
}

/* TRES PETITS TELEPHONES */

@media (max-width: 360px) {
  .story-layout {
    gap: 7px;
    padding: 0 8px;
  }

  .message-heading h2 {
    font-size: 1rem;
  }

  .message-scroll {
    padding: 7px 6px;
  }

  .message-scroll p {
    font-size: .76rem;
    line-height: 1.45;
  }

  .message-actions button {
    padding: 7px 7px;
    font-size: 10px;
  }
}

/* TELEPHONE EN PAYSAGE */

@media (max-height: 450px) and (orientation: landscape) {
  .story-layout {
    height: 43dvh;
    bottom: 3dvh;
  }

  .message-heading {
    padding: 4px;
  }

  .message-heading h2 {
    font-size: 1rem;
  }

  .step-count {
    display: none;
  }

  .message-scroll {
    padding: 5px 8px;
  }

  .message-scroll p {
    font-size: .78rem;
    line-height: 1.4;
  }

  .message-actions {
    padding: 4px;
  }

  .message-actions button {
    padding: 5px 8px;
  }

  .photo-caption {
    height: 20px;
  }

  .welcome-photo {
    height: 65px;
  }

  .welcome-card {
    padding: 9px;
  }

  .welcome h1 {
    margin: 4px 0;
    font-size: 1.8rem;
  }

  .welcome p {
    margin: 5px auto;
    font-size: .78rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- VIDEO -->

<video
  class="bg-video"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  aria-hidden="true">
  <source src="./fond.mp4" type="video/mp4">
</video>

<div class="bg-overlay"></div>

<main class="app" id="app">

  <!-- ACCUEIL -->

  <section class="welcome" id="welcome">
    <div class="welcome-card">

      <div class="welcome-photo">
        <img src="./image0.jpeg" alt="Un souvenir pour Sama Khol">
      </div>

      <div class="welcome-label">
        Une surprise rien que pour toi
      </div>

      <h1>Pour Sama Khol ❤️</h1>

      <p>
        Prends une grande inspiration et clique
        ci-dessous pour commencer ce petit voyage.
      </p>

      <button id="open-btn" type="button">
        Découvrir ✨
      </button>

    </div>
  </section>

  <!-- HISTOIRE -->

  <section class="story-layout" id="story">

    <!-- MESSAGE -->

    <article class="message-panel">

      <header class="message-heading">
        <h2 id="story-title">Pour Sama Khol ❤️</h2>
        <span class="step-count" id="step-count">1 / 5</span>
      </header>

      <div
        class="message-scroll"
        id="message-scroll"
        tabindex="0">
        <p id="story-text"></p>
      </div>

      <div class="message-actions">
        <button id="next-btn" type="button">
          Continuer ✨
        </button>
      </div>

    </article>

    <!-- PHOTO -->

    <aside class="photo-panel">

      <div class="photo-frame">
        <img
          id="story-image"
          src="./image1.jpeg"
          alt="Notre souvenir">
      </div>

      <div class="photo-caption" id="photo-caption">
        Un souvenir, une émotion ❤️
      </div>

    </aside>

  </section>

</main>

<script>
"use strict";

/* TES CINQ MESSAGES */

const steps = [
  {
    title: "Pour Sama Khol ❤️",
    text: "J'ai voulu te préparer une petite surprise, juste pour illuminer ta journée et te faire sourire.",
    image: "./image1.jpeg"
  },
  {
    title: "Nos précieux moments...",
    text: "Chaque instant passé à tes côtés est gravé dans mon cœur comme un souvenir inestimable.",
    image: "./image2.jpeg"
  },
  {
    title: "Une évidence au quotidien...",
    text: "Tu apportes une douceur, une joie et une lumière uniques dans ma vie.",
    image: "./image3.jpeg"
  },
  {
    title: "Toujours à tes côtés...",
    text: "Regarde le chemin parcouru et tout ce qu'il nous reste encore à construire ensemble.",
    image: "./image4.jpeg"
  },
  {
    title: "Je t'aime Sama Khol ❤️",
    text: "Simplement, profondément et sincèrement. Tu es tout pour moi.",
    image: "./image5.jpeg",
    isFinal: true
  }
];

const app = document.getElementById("app");
const welcome = document.getElementById("welcome");
const story = document.getElementById("story");
const openBtn = document.getElementById("open-btn");
const nextBtn = document.getElementById("next-btn");
const titleEl = document.getElementById("story-title");
const textEl = document.getElementById("story-text");
const imageEl = document.getElementById("story-image");
const countEl = document.getElementById("step-count");
const scrollEl = document.getElementById("message-scroll");
const captionEl = document.getElementById("photo-caption");
const video = document.querySelector(".bg-video");

let currentStep = 0;
let changing = false;
let heartsTimer = null;
let opened = false;

story.inert = true;

/* AFFICHER UNE ETAPE */

function showStep(index, animate = true) {
  if (changing || index >= steps.length) return;

  changing = true;

  const step = steps[index];

  if (animate) {
    imageEl.classList.add("fade");
    textEl.style.opacity = "0";
  }

  setTimeout(() => {
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    imageEl.src = step.image;
    imageEl.alt = `Souvenir ${index + 1}`;
    countEl.textContent = `${index + 1} / ${steps.length}`;

    scrollEl.scrollTop = 0;

    captionEl.textContent = step.isFinal
      ? "Toi, moi, et tout ce qu'il nous reste à vivre ❤️"
      : "Un souvenir, une émotion ❤️";

    imageEl.classList.remove("fade");
    textEl.style.opacity = "1";

    currentStep = index;

    if (step.isFinal) {
      nextBtn.style.display = "none";
      startFloatingEffects();
    } else {
      nextBtn.style.display = "inline-block";
      nextBtn.textContent = "Continuer ✨";
    }

    changing = false;
  }, animate ? 320 : 0);
}

/* OUVRIR LA SURPRISE */

openBtn.addEventListener("click", () => {
  if (opened) return;

  opened = true;
  app.classList.add("opened");

  story.inert = false;
  welcome.inert = true;

  showStep(0, false);
});

/* PASSER AU MESSAGE SUIVANT */

nextBtn.addEventListener("click", () => {
  if (changing) return;

  const nextIndex = currentStep + 1;

  if (nextIndex < steps.length) {
    showStep(nextIndex);
  }
});

/* COEURS FLOTTANTS */

function createFloatingElement() {
  const icons = ["❤️", "💖", "✨", "💕", "🌸"];

  const element = document.createElement("div");
  element.className = "floating-element";

  element.textContent =
    icons[Math.floor(Math.random() * icons.length)];

  element.style.left = Math.random() * 100 + "vw";
  element.style.fontSize =
    (Math.random() * 14 + 18) + "px";

  const duration = Math.random() * 2 + 4;

  element.style.animationDuration = duration + "s";

  document.body.appendChild(element);

  setTimeout(() => {
    element.remove();
  }, (duration + .2) * 1000);
}

function startFloatingEffects() {
  if (heartsTimer !== null) return;

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    return;
  }

  heartsTimer = setInterval(createFloatingElement, 500);
}

/* VIDEO */

video.play().catch(() => {});

/* BLOQUER LE DEFILEMENT GLOBAL */

document.addEventListener("wheel", (event) => {
  if (!event.target.closest(".message-scroll")) {
    event.preventDefault();
  }
}, { passive: false });

document.addEventListener("touchmove", (event) => {
  if (!event.target.closest(".message-scroll")) {
    event.preventDefault();
  }
}, { passive: false });

</script>
</body>
</html>
